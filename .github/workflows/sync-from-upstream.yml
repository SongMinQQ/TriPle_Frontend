name: Sync from upstream

on:
  repository_dispatch:
    types: [sync-from-upstream]

  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'SongMinQQ/TriPle_Frontend'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SYNC }}
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Team-TriPle/TriPle_Frontend
          git fetch upstream develop

      - name: Sync upstream/develop into fork/develop
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/develop; then
            git checkout -B develop origin/develop
          else
            git checkout -B develop upstream/develop
          fi
          git merge --ff-only upstream/develop

      - name: Push changes back to fork
        run: |
          git push origin develop
